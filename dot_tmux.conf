# remap prefix from 'C-b' to 'C-a'
unbind C-d
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using v and h
bind h split-window -h
bind v split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-left select-pane -L
bind -n M-right select-pane -R
bind -n M-up select-pane -U
bind -n M-down select-pane -D

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# =============================================
# Tmux Resurrect & Continuum (自动保存/恢复)
# =============================================

# 插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect 设置
set -g @resurrect-capture-pane-contents 'on'    # 保存面板内容
set -g @resurrect-save-shell-history 'on'       # 尝试保存 shell 历史

# Continuum 自动保存设置
set -g @continuum-restore 'on'                  # 启动时自动恢复
set -g @continuum-save-interval '5'             # 每5分钟自动保存

# 初始化 TPM (必须保持在这行在最后)
run '~/.tmux/plugins/tpm/tpm'
